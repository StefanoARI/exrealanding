<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cyanDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="14" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- 3D Isometric Geometric 'E' & Spatial Cube -->
  <g transform="translate(14, 12)" filter="url(#glow)">
    <!-- Top Face -->
    <path d="M18 3 L33 11 L18 19 L3 11 Z" fill="url(#cyanGrad)"/>
    <!-- Left Face with Cutout (forming 3D dimensional E) -->
    <path d="M3 11 L18 19 L18 37 L3 29 Z" fill="url(#cyanDarkGrad)"/>
    <!-- Right Face -->
    <path d="M18 19 L33 11 L33 29 L18 37 Z" fill="#0284c7" fill-opacity="0.85"/>
    
    <!-- Inner Core E Accent Lines -->
    <path d="M18 19 L18 37" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M10 15 L26 23" stroke="#e0f2fe" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.75"/>
    <circle cx="18" cy="19" r="2.5" fill="#ffffff"/>
  </g>
</svg>
